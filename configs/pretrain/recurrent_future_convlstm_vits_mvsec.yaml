data:
  manifest: data/mvsec/processed/manifests/train.jsonl
  store: hdf5
  split: train
  samples_per_epoch: 6250
  batch_size: 8
  workers: 4
  sequence_sampling: sequence_balanced
  # Preserve the complete 346x260 DAVIS field of view by centering it in a
  # patch-16-compatible 352x272 canvas. Padding is always event-empty.
  crop_size: [272, 352]
  allow_center_padding: true
  horizontal_flip_probability: 0.5

representation:
  type: voxel_grid
  temporal_bins: 5
  split_polarity: true
  normalization: log1p

windows:
  train_ms: [50]
  eval_ms: [25, 50, 75, 100]
  unseen_eval_ms: [25, 75, 100]
  target_ms: [50]
  canonical_ms: 50
  minimum_ratio: 1.0
  direction: any
  allow_equal: true

model:
  architecture: vjepa2_1
  image_size: [272, 352]
  patch_size: 16
  embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  deep_supervision_layers: [11]
  predictor_dim: 256
  predictor_depth: 4
  predictor_heads: 8
  scale_dim: 128
  scale_fourier_bands: 16
  condition_on_scale: true

recurrent:
  sequence_loader: true
  temporal_model: conv_lstm
  return_patch_event_activity: true
  recurrent_placement: post_encoder
  prediction_horizon_steps: 1
  kernel_size: 3
  # Independent recording-level clips avoid hidden-state coupling between
  # evaluation protocols; outdoor_day1 is never present in this manifest.
  sampling: random
  stream_ratio: 0.0
  window_ms: 50
  stride_ms: 50
  sequence_length: 8
  burn_in_steps: 2
  tbptt_steps: 8

mask:
  target_blocks: 4
  target_area_range: [0.15, 0.25]
  target_aspect_range: [0.5, 2.0]
  context_keep_ratio: 0.60
  activity_aware_probability: 0.0
  activity_candidates: 32
  minimum_active_target_ratio: 0.25

future_prediction:
  active_min_events: 1
  activity_floor: 0.01
  frame_sigreg_weight: 0.02
  temporal_sigreg_weight: 0.0
  # Window-level recurrent patch-token adaptation (not event-level RA/LS
  # reproduction). Keep both weights at zero for the JEPA-only baseline.
  rate_alignment_weight: 0.0
  rate_alignment_gamma: 1.0
  rate_alignment_eps: 0.000001
  rate_alignment_normalization: per_clip_mean_supported_patch_rate
  latent_straightening_weight: 0.0
  latent_straightening_eps: 0.000001
  projector_hidden_dim: 512
  projector_output_dim: 256
  sigreg_num_slices: 256
  sigreg_t_max: 3.0
  sigreg_num_points: 17
  projection_seed: 17

optimization:
  objective: recurrent_future_jepa
  epochs: 100
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  warmup_epochs: 10
  weight_decay: 0.05
  target_ema_start: 0.996
  target_ema_end: 0.9999
  precision: fp16
  gradient_clip: 1.0
  variance_weight: 0.0
  covariance_weight: 0.0
  canonical_query_weight: 0.0

runtime:
  seed: 0
  output_dir: outputs/pretrain/recurrent_future_convlstm_vits_mvsec_seed0
  log_every_steps: 20
  checkpoint_every_epochs: 1
  resume: null
