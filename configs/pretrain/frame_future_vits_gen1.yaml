data:
  manifest: /home/iASL/Arata_repo/dataset/gen1_304x240/manifests/train.jsonl
  store: hdf5
  split: train
  samples_per_epoch: 6250
  batch_size: 16
  workers: 4
  sequence_sampling: sequence_balanced
  crop_size: [240, 304]
  horizontal_flip_probability: 0.5

representation:
  type: voxel_grid
  temporal_bins: 5
  split_polarity: true
  normalization: log1p

# Frame-only baseline: every 50 ms event window predicts the stateless EMA
# latent one step (50 ms) later without a recurrent temporal model.
windows:
  train_ms: [50]
  eval_ms: [25, 50, 75, 100]
  unseen_eval_ms: [25, 75, 100]
  target_ms: [50]
  canonical_ms: 50
  minimum_ratio: 1.0
  direction: any
  allow_equal: true

model:
  architecture: vjepa2_1
  image_size: [240, 304]
  patch_size: 16
  embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  deep_supervision_layers: [11]
  predictor_dim: 256
  predictor_depth: 4
  predictor_heads: 8
  scale_dim: 128
  scale_fourier_bands: 16
  condition_on_scale: true

# Keep the same sequence clips, burn-in prefix, supervised suffix, mixed
# sampler, and future alignment as the recurrent run. Burn-in windows are read
# for sample matching but are not passed through the frame-only encoder.
recurrent:
  sequence_loader: true
  temporal_model: feedforward
  return_patch_event_activity: true
  prediction_horizon_steps: 1
  sampling: mixed
  stream_ratio: 0.5
  window_ms: 50
  stride_ms: 50
  sequence_length: 8
  burn_in_steps: 2
  tbptt_steps: 8

# Future objectives are full-grid and do not pass these diagnostic masks into
# the online encoder, predictor, or EMA target encoder.
mask:
  target_blocks: 4
  target_area_range: [0.15, 0.25]
  target_aspect_range: [0.5, 2.0]
  context_keep_ratio: 0.60
  activity_aware_probability: 0.0
  activity_candidates: 32
  minimum_active_target_ratio: 0.25

future_prediction:
  active_min_events: 1
  activity_floor: 0.01
  frame_sigreg_weight: 0.02
  temporal_sigreg_weight: 0.0
  projector_hidden_dim: 512
  projector_output_dim: 256
  sigreg_num_slices: 256
  sigreg_t_max: 3.0
  sigreg_num_points: 17
  projection_seed: 17

optimization:
  objective: frame_future_jepa
  epochs: 100
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  warmup_epochs: 10
  weight_decay: 0.05
  target_ema_start: 0.996
  target_ema_end: 0.9999
  precision: fp16
  gradient_clip: 1.0
  variance_weight: 0.0
  covariance_weight: 0.0
  canonical_query_weight: 0.0

runtime:
  seed: 0
  output_dir: outputs/pretrain/frame_future_vits_gen1_seed0
  log_every_steps: 20
  checkpoint_every_epochs: 1
  resume: null
