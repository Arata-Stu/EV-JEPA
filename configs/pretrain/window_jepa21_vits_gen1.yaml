data:
  manifest: /media/noah-22/AT_SSD/dataset/evjepa/gen1_304x240/manifests/train.jsonl
  store: hdf5
  split: train
  samples_per_epoch: 50000
  batch_size: 64
  workers: 8
  sequence_sampling: sequence_balanced
  crop_size: [240, 304]
  horizontal_flip_probability: 0.5

representation:
  type: voxel_grid
  temporal_bins: 5
  split_polarity: true
  normalization: log1p

windows:
  train_ms: [10, 20, 40, 80]
  eval_ms: [5, 10, 15, 20, 30, 40, 60, 80, 120]
  unseen_eval_ms: [5, 15, 30, 60, 120]
  target_ms: [10, 20, 40, 80]
  canonical_ms: 40
  minimum_ratio: 1.5
  direction: any
  allow_equal: true

model:
  # Flat global ViT: Conv2d patch projection -> RoPE/SDPA transformer blocks.
  architecture: vjepa2_1
  image_size: [240, 304]
  patch_size: 16
  embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  # Zero-based layers corresponding to V-JEPA 2.1 ViT-B hierarchical outputs.
  # They all retain the same 15x19 token grid; this is not a feature pyramid.
  deep_supervision_layers: [2, 5, 8, 11]
  predictor_dim: 256
  predictor_depth: 4
  predictor_heads: 8
  scale_dim: 128
  scale_fourier_bands: 16
  condition_on_scale: true

mask:
  target_blocks: 4
  target_area_range: [0.15, 0.25]
  target_aspect_range: [0.5, 2.0]
  context_keep_ratio: 0.60
  # Prefer masks containing context activity without making mask geometry a
  # deterministic event-location oracle. The remaining 30% stays uniform.
  activity_aware_probability: 0.70
  activity_candidates: 32
  minimum_active_target_ratio: 0.25

optimization:
  # Predict masked targets and retained visible tokens at four encoder depths.
  objective: dense_window_jepa
  epochs: 100
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  warmup_epochs: 10
  weight_decay: 0.05
  target_ema_start: 0.99925
  target_ema_end: 0.99925
  precision: bf16
  gradient_clip: 1.0
  variance_weight: 0.0
  covariance_weight: 0.0
  # Also train the full-context path used by canonical_latent downstream.
  canonical_query_weight: 0.25

runtime:
  seed: 0
  # Relative to the EV-JEPA project root, not the external dataset SSD.
  output_dir: outputs/pretrain/vjepa21_vits_gen1_event_aware_seed0
  log_every_steps: 20
  checkpoint_every_epochs: 1
  resume: null
