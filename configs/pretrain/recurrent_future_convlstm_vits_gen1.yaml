data:
  manifest: /home/iASL/Arata_repo/dataset/gen1_304x240/manifests/train.jsonl
  store: hdf5
  split: train
  # 6250 clips x 8 prediction pairs keeps the nominal epoch near 50k pairs.
  samples_per_epoch: 6250
  # Intended baseline: three V100 32 GB GPUs, 16 clips per rank.
  batch_size: 16
  workers: 4
  sequence_sampling: sequence_balanced
  crop_size: [240, 304]
  horizontal_flip_probability: 0.5

representation:
  type: voxel_grid
  temporal_bins: 5
  split_polarity: true
  normalization: log1p

# Every 50 ms context predicts the feedforward EMA latent one step (50 ms)
# later. Context and target durations are equal; their timestamps are not.
windows:
  train_ms: [50]
  eval_ms: [25, 50, 75, 100]
  unseen_eval_ms: [25, 75, 100]
  target_ms: [50]
  canonical_ms: 50
  minimum_ratio: 1.0
  direction: any
  allow_equal: true

model:
  architecture: vjepa2_1
  image_size: [240, 304]
  patch_size: 16
  embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  # Future JEPA supervises the final frame latent only.
  deep_supervision_layers: [11]
  predictor_dim: 256
  predictor_depth: 4
  predictor_heads: 8
  scale_dim: 128
  scale_fourier_bands: 16
  condition_on_scale: true

recurrent:
  sequence_loader: true
  temporal_model: conv_lstm
  return_patch_event_activity: true
  recurrent_placement: post_encoder
  prediction_horizon_steps: 1
  kernel_size: 3
  # Per-rank batch 16 = 8 causal stream + 8 independently sampled clips.
  sampling: mixed
  stream_ratio: 0.5
  window_ms: 50
  stride_ms: 50
  # The sampler reads 2 burn-in + 8 context + 1 target-only lookahead windows.
  sequence_length: 8
  burn_in_steps: 2
  tbptt_steps: 8

# Spatial masks are still generated for comparable diagnostics, but the future
# objective deliberately does not pass them into either encoder or ConvLSTM.
mask:
  target_blocks: 4
  target_area_range: [0.15, 0.25]
  target_aspect_range: [0.5, 2.0]
  context_keep_ratio: 0.60
  activity_aware_probability: 0.0
  activity_candidates: 32
  minimum_active_target_ratio: 0.25

future_prediction:
  active_min_events: 1
  activity_floor: 0.01
  # Frame weight controls the mean of global-frame and active/inactive support
  # SIGReg. train.jsonl also records every raw term and its effective samples.
  frame_sigreg_weight: 0.02
  temporal_sigreg_weight: 0.02
  projector_hidden_dim: 512
  projector_output_dim: 256
  # 256 slices is the compute-conscious V100 baseline; raise to 1024 only as an
  # ablation after the objective is known to be stable.
  sigreg_num_slices: 256
  sigreg_t_max: 3.0
  sigreg_num_points: 17
  projection_seed: 17

optimization:
  objective: recurrent_future_jepa
  epochs: 100
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  warmup_epochs: 10
  weight_decay: 0.05
  target_ema_start: 0.996
  target_ema_end: 0.9999
  precision: fp16
  gradient_clip: 1.0
  variance_weight: 0.0
  covariance_weight: 0.0
  canonical_query_weight: 0.0

runtime:
  seed: 0
  output_dir: outputs/pretrain/recurrent_future_convlstm_vits_gen1_seed0
  log_every_steps: 20
  checkpoint_every_epochs: 1
  resume: null
