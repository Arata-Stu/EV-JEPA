data:
  manifest: data/manifests/pretrain.jsonl
  store: hdf5
  split: train
  samples_per_epoch: 100000
  batch_size: 64
  workers: 8
  sequence_sampling: dataset_balanced
  crop_size: [224, 224]
  horizontal_flip_probability: 0.5

representation:
  type: voxel_grid
  temporal_bins: 5
  split_polarity: true
  normalization: log1p

windows:
  train_ms: [40]
  eval_ms: [5, 10, 15, 20, 30, 40, 60, 80, 120]
  unseen_eval_ms: [5, 10, 15, 20, 30, 60, 80, 120]
  target_ms: [40]
  canonical_ms: 40
  minimum_ratio: 1.0
  direction: any
  allow_equal: true

model:
  image_size: [224, 224]
  patch_size: 16
  embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  predictor_dim: 256
  predictor_depth: 4
  predictor_heads: 8
  scale_dim: 128
  scale_fourier_bands: 16
  condition_on_scale: false

mask:
  target_blocks: 4
  target_area_range: [0.15, 0.25]
  target_aspect_range: [0.5, 2.0]
  context_keep_ratio: 0.60

optimization:
  objective: window_jepa
  epochs: 100
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  warmup_epochs: 10
  weight_decay: 0.05
  target_ema_start: 0.996
  target_ema_end: 1.0
  precision: bf16
  gradient_clip: 1.0
  variance_weight: 0.0
  covariance_weight: 0.0
  canonical_query_weight: 0.0

runtime:
  seed: 0
  output_dir: outputs/fixed_jepa
  log_every_steps: 20
  checkpoint_every_epochs: 1
  resume: null
