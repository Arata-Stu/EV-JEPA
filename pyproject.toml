[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-window-jepa"
version = "0.1.0"
description = "Temporal-accumulation-conditioned JEPA pretraining for event-camera representations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "tensorboard>=2.16",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
hdf5 = [
  "h5py>=3.10",
  "hdf5plugin>=4.4",
  "numba>=0.59",
]
detection = [
  "pycocotools>=2.0.7",
  "torchvision>=0.17",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
window-jepa-pretrain = "event_window_jepa.train.pretrain:main"
window-jepa-inspect = "event_window_jepa.inspection:main"
window-jepa-inspect-recurrent = "event_window_jepa.recurrent_inspection:main"
window-jepa-preprocess = "event_window_jepa.preprocessing.cli:main"
window-jepa-merge-manifests = "event_window_jepa.preprocessing.merge_manifests:main"
window-jepa-m3ed-splits = "event_window_jepa.preprocessing.m3ed_splits:main"
window-jepa-summarize = "event_window_jepa.evaluation.window_sweep:main"
window-jepa-gen1-probe = "event_window_jepa.downstream.gen1_roi_probe:main"
window-jepa-gen1-detect = "event_window_jepa.downstream.gen1_detection:main"
window-jepa-mask-audit = "event_window_jepa.evaluation.mask_strategy_audit:main"
window-jepa-visualize-future = "event_window_jepa.evaluation.future_feature_visualization:main"
window-jepa-visualize-flow = "event_window_jepa.evaluation.cmax_flow_visualization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"event_window_jepa.third_party.rvt_detection" = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/event_window_jepa/third_party/rvt_detection"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
